name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every job declares timeout-minutes. Without one GitHub applies a 360-minute
# default, roughly 900x the median job in this org, so a hung step burns hours
# of runner time before anything stops it.
jobs:
  test:
    strategy:
      matrix:
        node-version: [20, 22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
